{{ $shape := .Get "shape" | default "landscape" }}
<figure class="video-container video-{{ $shape }}" style="margin: 2rem auto; {{ if eq $shape "portrait" }}max-width: 400px;{{ else }}max-width: 100%;{{ end }}">
  <video 
    controls 
    preload="metadata" 
    style="width: 100%; height: auto; border-radius: {{ if .Get "caption" }}8px 8px 0 0{{ else }}8px{{ end }}; background: #000; display: block; margin-bottom: 0;"
    {{ with .Get "poster" }}poster="{{ . }}"{{ end }}
    {{ if ne (.Get "autoplay") "false" }}{{ if or (.Get "autoplay") (.Get "muted") }}autoplay muted loop playsinline{{ end }}{{ end }}
  >
    <source src="{{ .Get "src" }}" type="{{ .Get "type" | default "video/mp4" }}">
    Your browser does not support the video tag.
  </video>
  {{ with .Get "caption" }}
  <figcaption class="video-caption" style="text-align: center; font-size: 0.9em; padding: 0.75rem; color: var(--text-secondary, #666); font-style: italic; border: 1px solid rgba(128, 128, 128, 0.2); border-top: none; border-radius: 0 0 8px 8px;">
    <span style="font-size: 1.25em; line-height: 0; vertical-align: middle; margin-right: 0.2rem; opacity: 0.7;">▴</span>{{ . }}
  </figcaption>
  {{ end }}
</figure>
